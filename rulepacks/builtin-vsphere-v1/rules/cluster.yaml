rules:
- schema_version: 1.0
  rule_id: VSL-CL-001
  rule_name: Cluster HA disabled
  category: cluster
  object_type: ClusterComputeResource
  risk_level: P2
  health_impact: attention
  confidence_level: high
  enabled: true
  rule_version: 1.0.0
  applicable_versions:
  - vSphere 6.7 legacy
  - vSphere 7.x
  - vSphere 8.x
  - vSphere 9.x
  data_source:
    type: pyvmomi
    source_domain: config
    api_paths:
    - ha_enabled
    object_path: inventory.clusters
    sampling:
      required: false
  condition:
    type: safe_expression
    fail_when: ha_enabled == False
    pass_when: ha_enabled == True
  severity_policy:
    type: fixed
    default_level: P2
    rules: []
  evidence_schema:
    current_value_path: ha_enabled
    expected_value: true
    required_fields:
    - run_id
    - vcenter_id
    - object_key
    - object_name
    - object_path
    - collected_at
    - collector_version
    - rule_version
    - data_quality
    - confidence_reason
  report_fields:
    check_name_zh: 集群 HA 状态
    finding_title_zh: 集群 HA 未启用
    plain_summary_zh: 检查 集群 HA 状态，确认配置或运行状态是否符合建议基线。
    failed_summary_zh: 发现集群 HA 未启用。
    title_zh: 集群 HA 未启用
    summary_zh: Cluster HA 功能处于关闭状态。
    business_impact_zh: 主机故障后虚拟机无法自动重启，业务恢复时间增加。
    technical_impact_zh: 集群级高可用保护不可用。
    consequence_zh: 单台主机故障可能扩大为业务中断。
    remediation_zh: 评估集群容量后启用 HA，并验证 HA 健康状态。
  remediation:
    owner_role: virtualization_admin
    remediation_effort: medium
    maintenance_window_required: true
    rollback_required: true
    verification_method: rerun_rule
    steps_zh:
    - 检查集群剩余容量和故障切换策略
    - 在维护窗口启用 vSphere HA
    - 验证 HA 健康状态并复跑巡检
  references:
  - title: vSphere Availability
    url: https://techdocs.broadcom.com/
  report:
    section: Cluster
    tags:
    - ha
  scoring:
    dimension: availability
    weight: 1.0
  implementation_status: implemented
  execution_mode: default_enabled
  scoring_eligible: true
  report_visibility:
  - show_in_rule_catalog
  - show_in_executed_matrix
- schema_version: 1.0
  rule_id: VSL-CL-002
  rule_name: HA admission control disabled
  category: cluster
  object_type: ClusterComputeResource
  risk_level: P2
  health_impact: attention
  confidence_level: high
  enabled: true
  rule_version: 1.0.0
  applicable_versions:
  - vSphere 6.7 legacy
  - vSphere 7.x
  - vSphere 8.x
  - vSphere 9.x
  data_source:
    type: pyvmomi
    source_domain: config
    api_paths:
    - ha_enabled
    - admission_control_enabled
    object_path: inventory.clusters
    sampling:
      required: false
  condition:
    type: safe_expression
    fail_when: ha_enabled == True and admission_control_enabled == False
    pass_when: ha_enabled == False or admission_control_enabled == True
  severity_policy:
    type: fixed
    default_level: P2
    rules: []
  evidence_schema:
    current_value_path: admission_control_enabled
    expected_value: true
    required_fields:
    - run_id
    - vcenter_id
    - object_key
    - object_name
    - object_path
    - collected_at
    - collector_version
    - rule_version
    - data_quality
    - confidence_reason
  report_fields:
    check_name_zh: 集群 HA 接入控制状态
    finding_title_zh: 集群 HA Admission Control 未启用
    plain_summary_zh: 检查 集群 HA 接入控制状态，确认配置或运行状态是否符合建议基线。
    failed_summary_zh: 发现集群 HA Admission Control 未启用。
    title_zh: HA 接入控制未启用
    summary_zh: HA Admission Control 处于关闭状态。
    business_impact_zh: 集群可能没有预留足够故障切换容量。
    technical_impact_zh: 主机故障后虚拟机可能因资源不足无法重启。
    consequence_zh: HA 保护等级降低，故障恢复结果不可控。
    remediation_zh: 根据业务等级启用合适的 Admission Control 策略。
  remediation:
    owner_role: virtualization_admin
    remediation_effort: medium
    maintenance_window_required: true
    rollback_required: true
    verification_method: rerun_rule
    steps_zh:
    - 评估故障切换容量需求
    - 启用并配置 Admission Control 策略
    - 验证故障切换容量和 HA 健康状态
  references:
  - title: vSphere Availability
    url: https://techdocs.broadcom.com/
  report:
    section: Cluster
    tags:
    - ha
  scoring:
    dimension: availability
    weight: 1.0
  implementation_status: implemented
  execution_mode: default_enabled
  scoring_eligible: true
  report_visibility:
  - show_in_rule_catalog
  - show_in_executed_matrix
