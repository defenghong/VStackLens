    finding_title_zh: 集群 DRS 未启用
    plain_summary_zh: 检查 集群 DRS 状态，确认配置或运行状态是否符合建议基线。
    failed_summary_zh: 发现集群 DRS 未启用。
    title_zh: 集群 DRS 未启用
    summary_zh: Cluster DRS 功能处于关闭状态。
    business_impact_zh: 集群无法自动均衡工作负载，可能影响业务性能稳定性。
    technical_impact_zh: 主机热点可能长期存在，资源调度依赖人工处理。
