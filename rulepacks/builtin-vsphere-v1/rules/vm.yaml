    finding_title_zh: VMware Tools 版本过旧
    plain_summary_zh: 检查 VMware Tools 版本状态，确认配置或运行状态是否符合建议基线。
    failed_summary_zh: 发现VMware Tools 版本过旧。
    title_zh: VMware Tools 版本过旧
    summary_zh: 虚拟机 VMware Tools 需要升级。
    business_impact_zh: 兼容性、驱动修复和管理能力可能不足。
    technical_impact_zh: 客户机驱动和增强组件版本落后。
    consequence_zh: 可能出现管理操作异常、性能问题或兼容性风险。
    remediation_zh: 在维护窗口升级 VMware Tools。
  remediation:
    owner_role: virtualization_admin
    remediation_effort: medium
