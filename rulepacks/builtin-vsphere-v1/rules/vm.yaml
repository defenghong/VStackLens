rules:
- schema_version: 1.0
  rule_id: VSL-VM-001
  rule_name: VM old snapshot
  category: vm
  object_type: VirtualMachine
  risk_level: P1
  health_impact: attention
  confidence_level: high
  enabled: true
  rule_version: 1.0.0
  applicable_versions:
  - vSphere 6.7 legacy
  - vSphere 7.x
  - vSphere 8.x
  - vSphere 9.x
  data_source:
    type: pyvmomi
    source_domain: config
    api_paths:
    - snapshot_age_days_max
    object_path: inventory.vms
    sampling:
      required: false
  condition:
    type: safe_expression
    fail_when: snapshot_age_days_max >= 7
    pass_when: snapshot_age_days_max < 7
  severity_policy:
    type: fixed
    default_level: P1
  evidence_schema:
    current_value_path: snapshot_age_days_max
    expected_value: < 7
    required_fields:
    - run_id
    - vcenter_id
    - object_key
    - object_name
    - object_path
    - collected_at
    - collector_version
    - rule_version
    - data_quality
    - confidence_reason
  report_fields:
    check_name_zh: 虚拟机快照状态
    finding_title_zh: 虚拟机存在超期快照
    plain_summary_zh: 检查 虚拟机快照状态，确认配置或运行状态是否符合建议基线。
    failed_summary_zh: 发现虚拟机存在超期快照。
    title_zh: 虚拟机存在超期快照
    summary_zh: 虚拟机快照保留时间超过阈值。
    business_impact_zh: 长期快照会占用存储并影响虚拟机性能。
    technical_impact_zh: 快照链可能持续增长，合并失败风险增加。
    consequence_zh: 可能导致 Datastore 空间耗尽、虚拟机性能下降或快照合并失败。
    remediation_zh: 确认快照用途后删除或合并快照。
  remediation:
    owner_role: virtualization_admin
    remediation_effort: medium
    maintenance_window_required: true
    rollback_required: true
    verification_method: rerun_rule
    steps_zh:
    - 确认快照创建人、用途和业务影响
    - 必要时先完成备份或业务确认
    - 在维护窗口删除或合并快照并复跑巡检
  references:
  - title: VMware snapshot best practices
    url: https://techdocs.broadcom.com/
  report:
    section: VM
    tags:
    - snapshot
  scoring:
    dimension: capacity
    weight: 1.0
  implementation_status: implemented
  execution_mode: default_enabled
  scoring_eligible: true
  report_visibility:
  - show_in_rule_catalog
  - show_in_executed_matrix
- schema_version: 1.0
  rule_id: VSL-VM-002
  rule_name: VMware Tools not running
  category: vm
  object_type: VirtualMachine
  risk_level: P3
  health_impact: none
  confidence_level: high
  enabled: true
  rule_version: 1.0.0
  applicable_versions:
  - vSphere 6.7 legacy
  - vSphere 7.x
  - vSphere 8.x
  - vSphere 9.x
  data_source:
    type: pyvmomi
    source_domain: runtime
    api_paths:
    - power_state
    - tools_running
    object_path: inventory.vms
    sampling:
      required: false
  condition:
    type: safe_expression
    fail_when: power_state == 'poweredOn' and tools_running == False
    pass_when: power_state != 'poweredOn' or tools_running == True
  severity_policy:
    type: fixed
    default_level: P3
    rules: []
  evidence_schema:
    current_value_path: tools_running
    expected_value: true
    required_fields:
    - run_id
    - vcenter_id
    - object_key
    - object_name
    - object_path
    - collected_at
    - collector_version
    - rule_version
    - data_quality
    - confidence_reason
  report_fields:
    check_name_zh: VMware Tools 运行状态
    finding_title_zh: VMware Tools 未运行
    plain_summary_zh: 检查 VMware Tools 运行状态，确认配置或运行状态是否符合建议基线。
    failed_summary_zh: 发现VMware Tools 未运行。
    title_zh: VMware Tools 未运行
    summary_zh: 已开机虚拟机的 VMware Tools 未运行。
    business_impact_zh: 客户机监控、备份和运维操作可能受到影响。
    technical_impact_zh: IP 获取、正常关机、备份集成和脚本操作可能不准确。
    consequence_zh: 可能导致管理操作失败、备份异常或监控数据缺失。
    remediation_zh: 启动或重新安装 VMware Tools。
  remediation:
    owner_role: virtualization_admin
    remediation_effort: low
    maintenance_window_required: false
    rollback_required: false
    verification_method: rerun_rule
    steps_zh:
    - 登录客户机检查 VMware Tools 服务
    - 启动 VMware Tools 服务
    - 必要时重新安装 VMware Tools 并复跑巡检
  references:
  - title: vSphere VM administration
    url: https://techdocs.broadcom.com/
  report:
    section: VM
    tags:
    - tools
  scoring:
    dimension: operations
    weight: 0.8
  implementation_status: implemented
  execution_mode: default_enabled
  scoring_eligible: true
  report_visibility:
  - show_in_rule_catalog
  - show_in_executed_matrix
