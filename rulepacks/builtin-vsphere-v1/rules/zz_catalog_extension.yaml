    failed_summary_zh: 发现虚拟机 CPU 或内存预留过高。
    summary_zh: 虚拟机配置了较高 CPU 或内存预留，可能占用集群可调度资源。
    business_impact_zh: 过高预留会降低资源池弹性，影响其他虚拟机调度和集群容量利用率。
    technical_impact_zh: Reservation 会保证资源分配，但过度配置会减少可分配资源并影响 DRS 调度。
    consequence_zh: 可能导致集群资源碎片化、虚拟机启动失败或容量规划偏差。
    remediation_zh: 结合业务 SLA 评估预留必要性，降低不合理预留或改用资源池策略。
