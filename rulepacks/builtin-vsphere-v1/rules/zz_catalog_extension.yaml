    failed_summary_zh: 发现虚拟机配置了资源 Limit。
    summary_zh: 虚拟机配置了 CPU 或内存 Limit，可能限制其在高负载时获得必要资源。
    business_impact_zh: 资源限制可能导致业务高峰期性能下降，即使集群仍有空闲资源。
