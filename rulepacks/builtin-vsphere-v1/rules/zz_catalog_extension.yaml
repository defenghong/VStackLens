  references:
  - title: VMware vSphere Documentation
    url: https://techdocs.broadcom.com/
  report:
    section: vm
    tags:
    - vm
    - catalog
  scoring:
    dimension: vm
    weight: 1.0
- schema_version: 1.0
  rule_id: VSL-VM-017
  rule_name: VM 是否存在孤立状态 orphaned/inaccessible
  category: vm
  object_type: VirtualMachine
  risk_level: P2
  health_impact: attention
  confidence_level: medium
  enabled: true
  rule_version: 1.0.0
  applicable_versions: *id001
  implementation_status: implemented
  execution_mode: default_enabled
  capability_required:
  - pyvmomi
  report_visibility:
  - show_in_rule_catalog
  - show_in_executed_matrix
  scoring_eligible: true
  data_source:
    type: pyvmomi
    source_domain: runtime
    api_paths:
    - orphaned_or_inaccessible
    object_path: inventory.vm
    sampling:
      required: false
  parameters: {}
  condition:
    type: safe_expression
    fail_when: orphaned_or_inaccessible == True
    pass_when: orphaned_or_inaccessible == False
  severity_policy:
    type: fixed
    default_level: P2
    rules: []
  evidence_schema:
    current_value_path: orphaned_or_inaccessible
    expected_value: false
    required_fields: *id002
  report_fields:
    title_zh: VM 是否存在孤立状态 orphaned/inaccessible
    check_name_zh: 虚拟机清单状态
    finding_title_zh: 虚拟机处于 orphaned 或 inaccessible 状态
    plain_summary_zh: 检查 虚拟机清单状态，确认配置或运行状态是否符合建议基线。
    failed_summary_zh: 发现虚拟机处于 orphaned 或 inaccessible 状态。
    summary_zh: 检查虚拟机是否处于 orphaned、inaccessible 或 invalid 等异常连接状态。
    business_impact_zh: 孤立或不可访问虚拟机通常意味着 vCenter 无法可靠管理该对象，可能影响业务恢复和运维操作。
    technical_impact_zh: VM runtime connectionState 异常时，虚拟机注册关系、存储访问或清单对象状态可能存在问题。
    consequence_zh: 可能导致虚拟机无法开关机、无法迁移、无法备份或无法准确纳入资产统计。
    remediation_zh: 核查虚拟机所在主机、数据存储和注册状态，按实际原因重新注册、恢复存储访问或清理无效对象。
  remediation:
    owner_role: virtualization_admin
    remediation_effort: medium
    maintenance_window_required: false
    rollback_required: false
    verification_method: rerun_rule
    steps_zh:
    - 查看虚拟机 runtime connectionState 和所在主机状态。
    - 核对虚拟机文件所在数据存储是否可访问。
    - 根据原因重新注册虚拟机、恢复存储访问或清理无效清单对象。
    - 复跑巡检，确认 orphaned_or_inaccessible 为 false。
  references:
  - title: VMware vSphere Documentation
    url: https://techdocs.broadcom.com/
  report:
    section: vm
    tags:
    - vm
    - catalog
  scoring:
    dimension: vm
    weight: 1.0
- schema_version: 1.0
  rule_id: VSL-VM-021
  rule_name: VM 是否挂载宿主机设备/直通设备
  category: vm
  object_type: VirtualMachine
  risk_level: P4
  confidence_level: medium
  enabled: true
  rule_version: 1.0.0
  applicable_versions: *id001
  implementation_status: implemented
  execution_mode: default_enabled
  capability_required:
  - pyvmomi
  report_visibility:
  - show_in_rule_catalog
  - show_in_executed_matrix
  scoring_eligible: true
  data_source:
    type: pyvmomi
    source_domain: config
    api_paths:
    - passthrough_device_count
    object_path: inventory.vm
    sampling:
      required: false
  parameters: {}
  condition:
    type: safe_expression
    fail_when: passthrough_device_count > 0
    pass_when: passthrough_device_count == 0
  severity_policy:
    type: fixed
    default_level: P4
    rules: []
  evidence_schema:
    current_value_path: passthrough_device_count
    expected_value: 0
    required_fields: *id002
  report_fields:
    false_positive_notes_zh: GPU、USB Key、专用 PCI 卡等直通设备可能是业务必需配置，不应直接要求移除。
    exception_guidance_zh: 确认直通设备用途、绑定主机、备份恢复方案和故障切换限制，并由业务负责人批准例外。
    when_to_ignore_zh: 图形工作站、授权加密狗、专用采集卡或 GPU 计算等明确依赖直通设备的场景可忽略。
    title_zh: VM 是否挂载宿主机设备/直通设备
    check_name_zh: 虚拟机直通设备配置
    finding_title_zh: 虚拟机挂载宿主机或直通设备
    plain_summary_zh: 检查 虚拟机直通设备配置，确认配置或运行状态是否符合建议基线。
    failed_summary_zh: 发现虚拟机挂载宿主机或直通设备。
    summary_zh: 检查虚拟机是否配置 PCI 直通等宿主机设备依赖。
    business_impact_zh: 直通设备会让虚拟机依赖特定主机硬件，可能限制 vMotion、HA 接管和标准化运维。
    technical_impact_zh: VirtualPCIPassthrough 等设备会改变虚拟机迁移和恢复能力，需要在资产和可用性评估中明确标识。
    consequence_zh: 主机故障或维护时虚拟机可能无法平滑迁移，恢复路径受限，维护窗口和回退复杂度增加。
    remediation_zh: 评估直通设备的业务必要性；非必要场景建议移除，必要场景需明确主机绑定、备份和恢复方案。
  remediation:
    owner_role: virtualization_admin
    remediation_effort: medium
    maintenance_window_required: true
    rollback_required: true
    verification_method: manual_check
    steps_zh:
    - 查看命中虚拟机的硬件设备列表，确认直通设备用途。
    - 与业务负责人确认该设备依赖是否必须保留。
    - 非必要时在维护窗口内移除直通设备并验证业务。
    - 必须保留时记录主机绑定、恢复预案和维护窗口要求。
    - 复跑巡检确认 passthrough_device_count 符合预期。
  references:
  - title: VMware vSphere Documentation
    url: https://techdocs.broadcom.com/
  report:
    section: vm
    tags:
    - vm
    - catalog
  scoring:
    dimension: vm
    weight: 1.0
- schema_version: 1.0
  rule_id: VSL-VM-022
  rule_name: VM 磁盘需要执行 Consolidation
  category: vm
  object_type: VirtualMachine
  risk_level: P3
  health_impact: none
  confidence_level: medium
  enabled: true
  rule_version: 1.0.0
  applicable_versions: *id001
  implementation_status: implemented
  execution_mode: default_enabled
  capability_required:
  - pyvmomi
  report_visibility:
  - show_in_rule_catalog
  - show_in_executed_matrix
  scoring_eligible: true
  data_source:
    type: pyvmomi
    source_domain: runtime
    api_paths:
    - needs_consolidation
    object_path: inventory.vm
    sampling:
      required: false
  parameters: {}
  condition:
    type: safe_expression
    fail_when: needs_consolidation == True
    pass_when: needs_consolidation == False
  severity_policy:
    type: fixed
    default_level: P3
    rules: []
  evidence_schema:
    current_value_path: needs_consolidation
    expected_value: false
    required_fields: *id002
  report_fields:
    title_zh: VM 磁盘需要执行 Consolidation
    check_name_zh: 虚拟机磁盘合并状态
    finding_title_zh: 虚拟机需要执行磁盘 Consolidation
    plain_summary_zh: 检查 虚拟机磁盘合并状态，确认配置或运行状态是否符合建议基线。
    failed_summary_zh: 发现虚拟机需要执行磁盘 Consolidation。
    summary_zh: 虚拟机存在需要 Consolidation 的磁盘状态，说明快照或磁盘链可能存在残留。
    business_impact_zh: 未及时合并可能持续占用存储空间，并增加后续快照、备份或迁移失败风险。
    technical_impact_zh: Consolidation needed 通常表示快照删除后仍有 redo log 或磁盘链未完全合并。
    consequence_zh: 可能导致 Datastore 空间增长、虚拟机性能下降或备份失败。
    remediation_zh: 确认备份任务和快照状态后，在合适窗口执行磁盘 Consolidation，并监控存储空间。
  remediation:
    owner_role: virtualization_admin
    remediation_effort: medium
    maintenance_window_required: false
    rollback_required: false
    verification_method: rerun_rule
    steps_zh:
    - 检查虚拟机快照和备份任务状态。
    - 确认 Datastore 剩余空间充足。
    - 在合适窗口执行 Consolidate。
    - 复核虚拟机告警、快照链和备份状态，并复跑巡检规则。
  references:
  - title: VMware vSphere Documentation
    url: https://techdocs.broadcom.com/
  report:
    section: vm
    tags:
    - vm
    - catalog
  scoring:
    dimension: vm
    weight: 1.0
