    object_path: inventory.vm
    sampling:
      required: false
  parameters: {}
  condition:
    type: safe_expression
    fail_when: invalid_network_count > 0
    pass_when: invalid_network_count == 0
  severity_policy:
    type: fixed
    default_level: P2
    rules: []
  evidence_schema:
    current_value_path: invalid_network_count
    expected_value: 0
    required_fields: *id002
  report_fields:
    title_zh: VM 是否连接到不存在/异常网络
    check_name_zh: 虚拟机网络连接状态
    finding_title_zh: 虚拟机连接到不存在或异常网络
    plain_summary_zh: 检查 虚拟机网络连接状态，确认配置或运行状态是否符合建议基线。
    failed_summary_zh: 发现虚拟机连接到不存在或异常网络。
    summary_zh: 检查虚拟机网卡是否连接到不存在或不可解析的网络后端。
    business_impact_zh: 虚拟机连接异常网络可能导致业务网络中断、迁移失败或故障恢复后无法正常访问。
    technical_impact_zh: 虚拟网卡 backing 缺少有效 network 引用时，说明端口组或分布式端口后端可能已删除、不可访问或配置异常。
    consequence_zh: 可能造成虚拟机网络不可用、业务访问失败，或在迁移、克隆、恢复过程中出现网络绑定错误。
    remediation_zh: 将虚拟机网卡重新连接到有效端口组或分布式端口组，并确认网络连通性。
  remediation:
    owner_role: network_admin
    remediation_effort: medium
    maintenance_window_required: false
    rollback_required: false
    verification_method: rerun_rule
    steps_zh:
    - 查看命中虚拟机的网卡连接状态和网络 backing。
    - 确认原端口组或分布式端口组是否已删除、重命名或不可访问。
    - 将虚拟机网卡连接到正确的业务网络。
