- schema_version: 1.0
  rule_id: VSL-VM-012
  rule_name: VM vCPU 数量过多
  category: vm
  object_type: VirtualMachine
  risk_level: P4
  confidence_level: medium
  enabled: true
  rule_version: 1.0.0
  applicable_versions: *id001
  implementation_status: implemented
  execution_mode: default_enabled
  capability_required:
  - pyvmomi
  report_visibility:
  - show_in_rule_catalog
  - show_in_executed_matrix
  scoring_eligible: true
  data_source:
    type: pyvmomi
    source_domain: config
    api_paths:
    - vcpu_count
    object_path: inventory.vm
    sampling:
      required: false
  parameters:
    max_vcpu_count:
      type: number
      default: 8
      override_allowed: true
  condition:
    type: safe_expression
    fail_when: vcpu_count > max_vcpu_count
    pass_when: vcpu_count <= max_vcpu_count
  severity_policy:
    type: fixed
    default_level: P4
    rules: []
  evidence_schema:
    current_value_path: vcpu_count
    expected_value: <= 8
    required_fields: *id002
  report_fields:
    false_positive_notes_zh: 大型数据库、中间件或高并发业务可能需要较高 vCPU；仅凭 vCPU 数量不能直接认定性能问题。
    exception_guidance_zh: 结合 CPU 使用率、CPU Ready、业务压测或容量评估结果确认配置合理性，并记录应用负责人确认。
    when_to_ignore_zh: 业务压测证明需要大规格 vCPU，且 CPU Ready 长期正常时可忽略。
    title_zh: VM vCPU 数量过多
    check_name_zh: 虚拟机 vCPU 配置
    finding_title_zh: 虚拟机 vCPU 数量过多
    plain_summary_zh: 检查 虚拟机 vCPU 配置，确认配置或运行状态是否符合建议基线。
    failed_summary_zh: 发现虚拟机 vCPU 数量过多。
    summary_zh: 虚拟机 vCPU 数量较多，可能增加调度开销并引发 CPU Ready 风险。
    business_impact_zh: 过多 vCPU 不一定提升性能，反而可能导致应用响应变慢和资源浪费。
    technical_impact_zh: ESXi 需要为多 vCPU 虚拟机调度足够的 CPU 时间片，vCPU 过多会增加调度等待。
    consequence_zh: 可能导致 CPU Ready 升高、集群资源利用率下降和性能调优困难。
    remediation_zh: 结合实际 CPU 使用率和业务需求，逐步下调过量 vCPU 配置并观察性能。
  remediation:
    owner_role: virtualization_admin
    remediation_effort: medium
    maintenance_window_required: true
    rollback_required: true
    verification_method: manual_check
    steps_zh:
    - 识别 vCPU 数量较高的虚拟机。
    - 查看 CPU 使用率、CPU Ready 和业务负载。
    - 与业务方确认资源需求。
    - 在维护窗口内调整 vCPU 并持续观察性能。
  references:
  - title: VMware vSphere Documentation
    url: https://techdocs.broadcom.com/
  report:
    section: vm
    tags:
    - vm
    - catalog
  scoring:
    dimension: vm
    weight: 1.0
- schema_version: 1.0
  rule_id: VSL-VM-015
  rule_name: VM 虚拟硬件版本过旧
  category: vm
  object_type: VirtualMachine
  risk_level: P4
  confidence_level: medium
  enabled: true
  rule_version: 1.0.0
  applicable_versions: *id001
  implementation_status: implemented
  execution_mode: default_enabled
  capability_required:
  - pyvmomi
  report_visibility:
  - show_in_rule_catalog
  - show_in_executed_matrix
  scoring_eligible: true
  data_source:
    type: pyvmomi
    source_domain: config
    api_paths:
    - hardware_version_number
    object_path: inventory.vm
    sampling:
      required: false
  parameters:
    min_hardware_version:
      type: number
      default: 15
      override_allowed: true
  condition:
    type: safe_expression
    fail_when: hardware_version_number < min_hardware_version
    pass_when: hardware_version_number >= min_hardware_version
  severity_policy:
    type: fixed
    default_level: P4
    rules: []
  evidence_schema:
    current_value_path: hardware_version_number
    expected_value: '>= 15'
    required_fields: *id002
  report_fields:
    false_positive_notes_zh: 老旧操作系统或厂商应用可能不支持升级虚拟硬件版本；该项通常属于兼容性优化提示。
    exception_guidance_zh: 确认操作系统、应用厂商和备份系统兼容性；如暂不升级，记录业务负责人和下次升级评估时间。
    when_to_ignore_zh: 老旧系统、厂商锁定版本或升级风险高于收益时可阶段性忽略。
    title_zh: VM 虚拟硬件版本过旧
    check_name_zh: 虚拟机硬件版本
    finding_title_zh: 虚拟机硬件版本过旧
    plain_summary_zh: 检查 虚拟机硬件版本，确认配置或运行状态是否符合建议基线。
    failed_summary_zh: 发现虚拟机硬件版本过旧。
    summary_zh: 虚拟机硬件版本较旧，可能限制新版 vSphere 的功能和兼容能力。
    business_impact_zh: 旧硬件版本可能影响后续升级、性能特性、安全能力或设备兼容。
    technical_impact_zh: 虚拟硬件版本决定虚拟设备能力和平台特性，过旧版本无法使用部分新功能。
    consequence_zh: 可能导致功能受限、兼容性风险增加或升级改造成本上升。
    remediation_zh: 在确认操作系统和业务兼容后，规划升级虚拟硬件版本。
  remediation:
    owner_role: virtualization_admin
    remediation_effort: medium
    maintenance_window_required: true
    rollback_required: true
    verification_method: manual_check
    steps_zh:
    - 识别硬件版本较旧的虚拟机。
    - 核对客户机操作系统和 VMware Tools 状态。
    - 在维护窗口内先做快照或备份。
    - 升级虚拟硬件版本并验证业务。
  references:
  - title: VMware vSphere Documentation
    url: https://techdocs.broadcom.com/
  report:
    section: vm
    tags:
    - vm
    - catalog
  scoring:
    dimension: vm
    weight: 1.0
- schema_version: 1.0
  rule_id: VSL-VM-016
  rule_name: VM 是否连接到不存在/异常网络
