rules:
- schema_version: 1.0
  rule_id: VSL-HOST-008
  rule_name: ESXi host certificate status
  category: host
  object_type: HostSystem
  risk_level: P2
  health_impact: attention
  confidence_level: high
  enabled: true
  rule_version: 1.0.0
  applicable_versions: &vsphere_versions
  - vSphere 6.7 legacy
  - vSphere 7.x
  - vSphere 8.x
  - vSphere 9.x
  implementation_status: implemented
  execution_mode: default_enabled
  capability_required: &pyvmomi_required
  - pyvmomi
  report_visibility: &executed_visibility
  - show_in_rule_catalog
  - show_in_executed_matrix
  scoring_eligible: true
  data_source:
    type: pyvmomi
    source_domain: certificate
    api_paths:
    - host_certificate_days_remaining
    - host_certificate_not_after
    - host_certificate_subject
    - host_certificate_issuer
    - host_certificate_probe_status
    object_path: inventory.hosts
    sampling:
      required: false
  parameters:
    host_certificate_warning_days:
      type: number
      default: 90
      override_allowed: true
    host_certificate_critical_days:
      type: number
      default: 30
      override_allowed: true
  condition:
    type: safe_expression
    fail_when: host_certificate_days_remaining <= host_certificate_warning_days
    pass_when: host_certificate_days_remaining > host_certificate_warning_days
  severity_policy:
    type: threshold
    default_level: P2
    rules:
    - when: host_certificate_days_remaining <= host_certificate_critical_days
      level: P1
    - when: host_certificate_days_remaining <= host_certificate_warning_days
      level: P2
  evidence_schema:
    current_value_path: host_certificate_days_remaining
    expected_value: '> 90'
    required_fields: &required_fields
    - run_id
    - vcenter_id
    - object_key
    - object_name
    - object_path
    - collected_at
    - collector_version
    - rule_version
    - data_quality
    - confidence_reason
  report_fields:
    title_zh: ESXi 主机证书即将过期
    check_name_zh: ESXi 主机证书状态
    finding_title_zh: ESXi 主机证书即将过期
    plain_summary_zh: 检查 ESXi 主机证书到期时间和证书主体信息，确认主机管理通道证书处于可持续使用状态。
    failed_summary_zh: ESXi 主机证书剩余有效期低于巡检阈值，需要提前安排续期或更新。
    false_positive_notes_zh: 主机即将退役或证书已在变更窗口内计划更新时，可结合变更记录复核处理优先级。
    exception_guidance_zh: 记录证书到期时间、计划更新时间、负责人和审批说明，到期前必须重新复核。
    when_to_ignore_zh: 主机已确认下线且不再承载业务时，可在下线完成前作为临时例外跟踪。
    summary_zh: ESXi 主机证书临近到期可能影响管理连接可信性和后续自动化运维。
    business_impact_zh: 证书过期可能导致管理连接告警、自动化任务失败或安全审计问题。
    technical_impact_zh: vCenter 与主机之间的证书信任链可能失效，影响主机管理和部分集成工具访问。
    consequence_zh: 如果证书到期未处理，可能引发管理访问异常、监控告警和变更窗口外紧急处置。
    remediation_zh: 建议在证书到期前完成主机证书更新，并复跑巡检确认剩余有效期恢复到阈值以上。
  remediation:
    owner_role: virtualization_admin
    remediation_effort: medium
    maintenance_window_required: true
    rollback_required: true
    verification_method: rerun_rule
    steps_zh:
    - 核对主机证书到期时间、主体和签发者。
    - 按客户证书管理流程更新 ESXi 主机证书。
    - 更新后确认 vCenter 与主机连接正常，并复跑巡检。
  references: &vmware_docs
  - title: VMware vSphere Documentation
    url: https://techdocs.broadcom.com/
  report:
    section: host
    tags:
    - host
    - certificate
  scoring:
    dimension: security
    weight: 1.0
- schema_version: 1.0
  rule_id: VSL-HOST-023
  rule_name: ESXi host license status
  category: host
  object_type: HostSystem
  risk_level: P2
  health_impact: attention
  confidence_level: high
  enabled: true
  rule_version: 1.0.0
  applicable_versions: *vsphere_versions
  implementation_status: implemented
  execution_mode: default_enabled
  capability_required: *pyvmomi_required
  report_visibility: *executed_visibility
  scoring_eligible: true
  data_source:
    type: pyvmomi
    source_domain: config
    api_paths:
    - host_license_assigned
    - host_license_name
    - host_license_edition
    - host_license_is_evaluation
    - host_license_expiration_days
    - host_license_expiration_date
    object_path: inventory.hosts
    sampling:
      required: false
  parameters:
    host_license_warning_days:
      type: number
      default: 90
      override_allowed: true
    host_license_critical_days:
      type: number
      default: 30
      override_allowed: true
  condition:
    type: safe_expression
    fail_when: host_license_assigned == False or host_license_is_evaluation == True or host_license_expiration_days <= host_license_warning_days
    pass_when: host_license_assigned == True and host_license_is_evaluation == False and host_license_expiration_days > host_license_warning_days
  severity_policy:
    type: threshold
    default_level: P2
    rules:
    - when: host_license_assigned == False
      level: P1
    - when: host_license_expiration_days <= host_license_critical_days
      level: P1
    - when: host_license_is_evaluation == True
      level: P2
    - when: host_license_expiration_days <= host_license_warning_days
      level: P2
  evidence_schema:
    current_value_path: host_license_expiration_days
    expected_value: '> 90 或永久授权'
    required_fields: *required_fields
  report_fields:
    title_zh: ESXi 主机 License 状态风险
    check_name_zh: ESXi 主机 License 状态
    finding_title_zh: ESXi 主机 License 状态异常
    plain_summary_zh: 检查 ESXi 主机授权分配、授权类型和到期时间，确认主机授权处于有效状态。
    failed_summary_zh: ESXi 主机授权未分配、处于评估版或剩余有效期低于阈值。
    false_positive_notes_zh: 新装主机短期处于评估授权时，应结合上线计划和正式授权申请进度复核。
    exception_guidance_zh: 记录授权申请单、预计导入时间、负责人和审批备注，并在到期前完成复核。
    when_to_ignore_zh: 主机已确认退役或仅用于短期测试且无生产业务承载时，可作为临时例外跟踪。
    summary_zh: ESXi 主机授权异常可能影响合规性、支持能力和后续功能使用。
    business_impact_zh: 授权过期或评估授权可能带来合规风险，并影响客户现场支持和扩容计划。
    technical_impact_zh: 授权状态异常可能限制部分 vSphere 功能或在后续版本中引发管理告警。
    consequence_zh: 如果授权长期未处理，可能造成审计问题、功能受限或紧急授权变更。
    remediation_zh: 建议导入正式有效 License，确认授权分配到对应 ESXi 主机后复跑巡检。
  remediation:
    owner_role: virtualization_admin
    remediation_effort: medium
    maintenance_window_required: false
    rollback_required: false
    verification_method: rerun_rule
    steps_zh:
    - 核对 ESXi 主机当前授权名称、版本和到期时间。
    - 导入并分配正式有效 License。
    - 确认授权状态正常后复跑巡检。
  references: *vmware_docs
  report:
    section: host
    tags:
    - host
    - license
  scoring:
    dimension: compliance
    weight: 1.0
- schema_version: 1.0
  rule_id: VSL-HOST-013
  rule_name: ESXi host log and core dump configuration
  category: host
  object_type: HostSystem
  risk_level: P3
  health_impact: none
  confidence_level: medium
  enabled: true
  rule_version: 1.0.0
  applicable_versions: *vsphere_versions
  implementation_status: implemented
  execution_mode: default_enabled
  capability_required: *pyvmomi_required
  report_visibility: *executed_visibility
  scoring_eligible: true
  data_source:
    type: pyvmomi
    source_domain: config
    api_paths:
    - host_log_core_dump_configured
    - host_log_core_dump_detail
    object_path: inventory.hosts
    sampling:
      required: false
  parameters: {}
  condition:
    type: safe_expression
    fail_when: host_log_core_dump_configured == False
    pass_when: host_log_core_dump_configured == True
  severity_policy:
    type: fixed
    default_level: P3
    rules: []
  evidence_schema:
    current_value_path: host_log_core_dump_configured
    expected_value: true
    required_fields: *required_fields
  report_fields:
    title_zh: ESXi 主机日志与核心转储配置不完整
    check_name_zh: ESXi 主机日志与核心转储配置
    finding_title_zh: ESXi 主机日志与核心转储配置不完整
    plain_summary_zh: 检查 ESXi 主机 Syslog 和核心转储配置，确认故障排查所需日志与转储信息可保留。
    failed_summary_zh: ESXi 主机日志或核心转储配置不完整，可能影响故障后的证据保留。
    false_positive_notes_zh: 测试主机、临时主机或已由其他日志平台统一采集时，可结合运维设计复核。
    exception_guidance_zh: 记录日志留存方案、核心转储替代方案和责任人，定期复核可用性。
    when_to_ignore_zh: 主机不承载生产业务且已有明确下线计划时，可阶段性忽略。
    summary_zh: 日志与核心转储配置不完整会降低故障定位效率。
    business_impact_zh: 发生主机故障后，可能缺少必要证据，延长业务恢复和根因分析时间。
    technical_impact_zh: 缺少远程日志或核心转储会影响 PSOD、驱动异常和系统崩溃场景分析。
    consequence_zh: 故障复盘时可能无法定位根因，增加重复故障风险。
    remediation_zh: 建议配置远程 Syslog 或持久化日志目录，并确认核心转储目标可用。
  remediation:
    owner_role: virtualization_admin
    remediation_effort: medium
    maintenance_window_required: false
    rollback_required: false
    verification_method: rerun_rule
    steps_zh:
    - 核对 Syslog.global.logHost 或持久化日志目录。
    - 核对核心转储分区或网络核心转储配置。
    - 完成配置后复跑巡检确认状态。
  references: *vmware_docs
  report:
    section: host
    tags:
    - host
    - logging
  scoring:
    dimension: operations
    weight: 0.8
- schema_version: 1.0
  rule_id: VSL-NET-003
  rule_name: Physical NIC error counter
  category: network
  object_type: HostSystem
  risk_level: P3
  health_impact: none
  confidence_level: medium
  enabled: true
  rule_version: 1.0.0
  applicable_versions: *vsphere_versions
  implementation_status: implemented
  execution_mode: default_enabled
  capability_required:
  - pyvmomi
  - performance_manager
  report_visibility: *executed_visibility
  scoring_eligible: true
  data_source:
    type: pyvmomi
    source_domain: performance
    api_paths:
    - pnic_error_count
    - pnic_error_detail
    object_path: inventory.hosts
    sampling:
      required: true
      window_minutes: 60
      minimum_samples: 1
  parameters:
    max_pnic_error_count:
      type: number
      default: 0
      override_allowed: true
  condition:
    type: safe_expression
    fail_when: pnic_error_count > max_pnic_error_count
    pass_when: pnic_error_count <= max_pnic_error_count
  severity_policy:
    type: fixed
    default_level: P3
    rules: []
  evidence_schema:
    current_value_path: pnic_error_count
    expected_value: 0
    required_fields: *required_fields
  report_fields:
    title_zh: 物理网卡错误计数异常
    check_name_zh: 物理网卡错误计数
    finding_title_zh: 物理网卡错误计数异常
    plain_summary_zh: 检查 ESXi 主机物理网卡错误和丢包计数，识别链路质量问题。
    failed_summary_zh: 物理网卡错误或丢包计数大于建议阈值，需要排查链路质量。
    false_positive_notes_zh: 维护窗口内链路切换、交换机变更或临时压测可能造成短期计数升高。
    exception_guidance_zh: 记录变更窗口、交换机端口、线缆模块和复测时间。
    when_to_ignore_zh: 已确认由计划内链路切换造成，且复测计数不再增长时可关闭或例外。
    summary_zh: 物理网卡错误计数升高可能反映链路质量、模块或交换机端口问题。
    business_impact_zh: 网络错误可能导致业务抖动、迁移失败或存储访问延迟。
    technical_impact_zh: pNIC 错误和丢包会影响 vSwitch/vDS 上承载的管理、vMotion 或业务网络。
    consequence_zh: 如不处理，可能持续产生网络重传、丢包和业务性能下降。
    remediation_zh: 建议检查异常网卡对应的线缆、模块、交换机端口和速率双工配置，处理后复测计数。
  remediation:
    owner_role: network_admin
    remediation_effort: medium
    maintenance_window_required: true
    rollback_required: true
    verification_method: rerun_rule
    steps_zh:
    - 核对主机物理网卡错误和丢包计数。
    - 检查交换机端口、线缆、模块和速率协商状态。
    - 修复后观察计数是否继续增长，并复跑巡检。
  references: *vmware_docs
  report:
    section: network
    tags:
    - network
    - pnic
  scoring:
    dimension: network
    weight: 0.8
- schema_version: 1.0
  rule_id: VSL-VM-018
  rule_name: VM powered off
  category: vm
  object_type: VirtualMachine
  risk_level: P3
  confidence_level: medium
  enabled: true
  rule_version: 1.0.0
  applicable_versions: *vsphere_versions
  implementation_status: implemented
  execution_mode: default_enabled
  capability_required: *pyvmomi_required
  report_visibility: *executed_visibility
  scoring_eligible: true
  data_source:
    type: pyvmomi
    source_domain: runtime
    api_paths:
    - power_state
    - is_template
    - is_system_vm
    object_path: inventory.vm
    sampling:
      required: false
  condition:
    type: safe_expression
    fail_when: power_state == "poweredOff" and is_template == False and is_system_vm == False
    pass_when: power_state != "poweredOff" or is_template == True or is_system_vm == True
  severity_policy:
    type: fixed
    default_level: P3
    rules: []
  evidence_schema:
    current_value_path: power_state
    expected_value: poweredOn
    required_fields: *required_fields
  report_fields:
    title_zh: 存在关机的虚拟机
    check_name_zh: 虚拟机电源状态
    finding_title_zh: 存在关机的虚拟机
    plain_summary_zh: 检查虚拟机电源状态，识别当前处于关机状态的虚拟机。
    failed_summary_zh: 环境中存在关机的虚拟机，建议确认虚拟机是否仍在使用，如无需求可进行删除，进行资源回收。
    false_positive_notes_zh: 灾备预留、模板化准备或按计划停用的虚拟机可能长期关机。
    exception_guidance_zh: 记录业务确认人、保留原因、复核周期和预计清理时间。
    when_to_ignore_zh: 已明确作为保留系统、审计留存或灾备对象时，可纳入例外清单定期复核。
    summary_zh: 关机虚拟机可能仍占用数据存储空间和备份资源。
    business_impact_zh: 环境中存在关机的虚拟机，建议确认虚拟机是否仍在使用，如无需求可进行删除，进行资源回收。
    technical_impact_zh: 关机虚拟机仍可能占用磁盘、快照、备份策略和清单管理资源。
    consequence_zh: 未使用的关机虚拟机可能持续占用存储和备份资源。
    remediation_zh: 环境中存在关机的虚拟机，建议确认虚拟机是否仍在使用，如无需求可进行删除，进行资源回收。
  remediation:
    owner_role: virtualization_admin
    remediation_effort: low
    maintenance_window_required: false
    rollback_required: true
    verification_method: manual_check
    steps_zh:
    - 确认虚拟机所属业务和最近使用情况。
    - 对无需保留的虚拟机执行归档、下线或删除流程。
    - 完成后复跑巡检确认清单状态。
  references: *vmware_docs
  report:
    section: vm
    tags:
    - vm
    - lifecycle
  scoring:
    dimension: operations
    weight: 0.5
- schema_version: 1.0
  rule_id: VSL-SEC-008
  rule_name: vCenter role permission inheritance
  category: security
  object_type: vCenter
  risk_level: P4
  confidence_level: medium
  enabled: true
  rule_version: 1.0.0
  applicable_versions: *vsphere_versions
  implementation_status: implemented
  execution_mode: default_enabled
  capability_required: *pyvmomi_required
  report_visibility: *executed_visibility
  scoring_eligible: true
  data_source:
    type: pyvmomi
    source_domain: config
    api_paths:
    - role_permission_inheritance_issue_count
    - role_permission_inheritance_issues
    object_path: inventory.vcenters
    sampling:
      required: false
  parameters:
    max_inherited_admin_permissions:
      type: number
      default: 3
      override_allowed: true
  condition:
    type: safe_expression
    fail_when: role_permission_inheritance_issue_count > max_inherited_admin_permissions
    pass_when: role_permission_inheritance_issue_count <= max_inherited_admin_permissions
  severity_policy:
    type: fixed
    default_level: P4
    rules: []
  evidence_schema:
    current_value_path: role_permission_inheritance_issue_count
    expected_value: <= 3
    required_fields: *required_fields
  report_fields:
    title_zh: vCenter 管理员权限继承范围过宽
    check_name_zh: vCenter 角色权限继承关系
    finding_title_zh: vCenter 管理员权限继承范围过宽
    plain_summary_zh: 检查 vCenter 管理员级权限的继承关系，识别继承范围较宽的授权主体。
    failed_summary_zh: 管理员级权限继承主体数量超过建议阈值，需要复核最小权限原则。
    false_positive_notes_zh: 小规模环境或集中运维团队可能采用较宽的继承授权，应结合权限审批记录复核。
    exception_guidance_zh: 记录授权主体、业务职责、审批记录和定期复核时间。
    when_to_ignore_zh: 授权主体均为受控目录组且具备审批、审计和定期复核机制时，可作为低优先级提示项。
    summary_zh: 权限继承范围过宽可能扩大管理员权限影响面。
    business_impact_zh: 权限边界不清会增加误操作和审计风险。
    technical_impact_zh: 在较高层级继承管理员权限会影响其下对象的访问控制边界。
    consequence_zh: 如果账号或组管理不当，可能导致过度授权和变更风险扩大。
    remediation_zh: 建议复核管理员级权限继承关系，按职责拆分角色并减少不必要的全局继承。
  remediation:
    owner_role: security_admin
    remediation_effort: medium
    maintenance_window_required: false
    rollback_required: true
    verification_method: manual_check
    steps_zh:
    - 导出 vCenter 管理员级权限和继承范围。
    - 核对授权主体、审批记录和职责边界。
    - 移除不必要的继承授权或改用更细粒度角色。
  references: *vmware_docs
  report:
    section: security
    tags:
    - security
    - permission
  scoring:
    dimension: security
    weight: 0.5
