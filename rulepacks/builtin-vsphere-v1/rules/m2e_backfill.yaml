rules:
- schema_version: 1.0
  rule_id: VSL-CL-010
  rule_name: Cluster host CPU model consistency
  category: cluster
  object_type: ClusterComputeResource
  risk_level: P4
  confidence_level: high
  enabled: true
  rule_version: 1.0.0
  applicable_versions: &vsphere_versions
  - vSphere 6.7 legacy
  - vSphere 7.x
  - vSphere 8.x
  - vSphere 9.x
  implementation_status: implemented
  execution_mode: default_enabled
  capability_required: &pyvmomi_required
  - pyvmomi
  report_visibility: &executed_visibility
  - show_in_rule_catalog
  - show_in_executed_matrix
  scoring_eligible: true
  data_source:
    type: pyvmomi
    source_domain: config
    api_paths:
    - host_cpu_model_distinct_count
    - host_cpu_models
    object_path: inventory.cluster
    sampling:
      required: false
  parameters: {}
  condition:
    type: safe_expression
    fail_when: host_cpu_model_distinct_count > 1
    pass_when: host_cpu_model_distinct_count <= 1
  severity_policy: &fixed_p4
    type: fixed
    default_level: P4
    rules: []
  evidence_schema:
    current_value_path: host_cpu_model_distinct_count
    expected_value: 1
    required_fields: &required_fields
    - run_id
    - vcenter_id
    - object_key
    - object_name
    - object_path
    - collected_at
    - collector_version
    - rule_version
    - data_quality
    - confidence_reason
  report_fields:
    title_zh: 集群主机 CPU 型号差异
    check_name_zh: 集群主机 CPU 型号一致性
    finding_title_zh: 集群主机 CPU 型号不一致
    plain_summary_zh: 检查集群内 ESXi 主机 CPU 型号一致性，用于评估迁移兼容性和硬件基线统一性。
    failed_summary_zh: 集群内存在多种 CPU 型号，后续跨主机迁移和扩容兼容性需要关注。
    false_positive_notes_zh: 已启用合适 EVC 模式且业务迁移验证通过时，该项通常属于提示性优化项。
    exception_guidance_zh: 记录 EVC 模式、CPU 型号清单和业务迁移验证结果，并在新增主机前复核。
    when_to_ignore_zh: 同一集群已通过 EVC 统一 CPU 特性，且没有跨代硬件扩容计划时可阶段性忽略。
    summary_zh: 集群主机 CPU 型号差异可能影响 vMotion 兼容性和硬件生命周期管理。
    business_impact_zh: 后续硬件扩容、主机替换或跨主机迁移时，可能增加兼容性验证和维护窗口成本。
    technical_impact_zh: 不同 CPU 型号会暴露不同指令集能力，未统一基线时可能限制虚拟机迁移目标。
    consequence_zh: 可能导致部分虚拟机无法迁移到特定主机，降低维护灵活性。
    remediation_zh: 结合 EVC 策略统一集群 CPU 兼容基线，后续扩容优先保持同代或兼容 CPU 型号。
  remediation:
    owner_role: virtualization_admin
    remediation_effort: low
    maintenance_window_required: false
    rollback_required: false
    verification_method: rerun_rule
    steps_zh:
    - 核对集群内主机 CPU 型号清单。
    - 确认当前 EVC 模式是否覆盖硬件差异。
    - 在新增主机或迁移业务前执行 vMotion 验证。
  references: &vmware_docs
  - title: VMware vSphere Documentation
    url: https://techdocs.broadcom.com/
  report:
    section: cluster
    tags:
    - cluster
    - compatibility
  scoring:
    dimension: compatibility
    weight: 0.5
- schema_version: 1.0
  rule_id: VSL-CL-011
  rule_name: Cluster host memory capacity consistency
  category: cluster
  object_type: ClusterComputeResource
  risk_level: P4
  confidence_level: high
  enabled: true
  rule_version: 1.0.0
  applicable_versions: *vsphere_versions
  implementation_status: implemented
  execution_mode: default_enabled
  capability_required: *pyvmomi_required
  report_visibility: *executed_visibility
  scoring_eligible: true
  data_source:
    type: pyvmomi
    source_domain: config
    api_paths:
    - host_memory_capacity_skew_ratio
    - host_memory_capacity_gb_values
    object_path: inventory.cluster
    sampling:
      required: false
  parameters:
    max_memory_skew_ratio:
      type: number
      default: 50
      override_allowed: true
  condition:
    type: safe_expression
    fail_when: host_memory_capacity_skew_ratio > max_memory_skew_ratio
    pass_when: host_memory_capacity_skew_ratio <= max_memory_skew_ratio
  severity_policy: *fixed_p4
  evidence_schema:
    current_value_path: host_memory_capacity_skew_ratio
    expected_value: <= 50
    required_fields: *required_fields
  report_fields:
    title_zh: 集群主机内存容量差异
    check_name_zh: 集群主机内存容量一致性
    finding_title_zh: 集群主机内存容量差异较大
    plain_summary_zh: 检查同一集群内主机内存容量差异，用于评估 DRS 负载均衡和 HA 接管余量。
    failed_summary_zh: 集群内主机内存容量差异超过建议阈值，可能影响负载均衡和故障接管能力。
    false_positive_notes_zh: 过渡期扩容、分批替换硬件时可能出现容量差异，该项可作为容量规划提示。
    exception_guidance_zh: 记录扩容计划、目标硬件配置和预计统一时间。
    when_to_ignore_zh: 已明确为混合规格集群且 DRS/HA 余量经过容量评估时可阶段性忽略。
    summary_zh: 集群主机内存容量差异较大时，负载可能集中到大规格主机，故障接管余量也更难评估。
    business_impact_zh: 维护或故障切换时，业务可能受到资源分布不均影响。
    technical_impact_zh: DRS 迁移建议和 HA Admission Control 容量计算会受到主机规格差异影响。
    consequence_zh: 可能导致局部资源热点、迁移目标受限或故障接管能力不均衡。
    remediation_zh: 结合容量规划逐步统一主机规格，或按规格拆分集群和业务承载范围。
  remediation:
    owner_role: virtualization_admin
    remediation_effort: medium
    maintenance_window_required: false
    rollback_required: false
    verification_method: rerun_rule
    steps_zh:
    - 核对集群内各主机内存容量。
    - 评估 DRS 分布和 HA 接管余量。
    - 制定主机规格统一或业务分组计划。
  references: *vmware_docs
  report:
    section: cluster
    tags:
    - cluster
    - capacity
  scoring:
    dimension: capacity
    weight: 0.5
- schema_version: 1.0
  rule_id: VSL-CL-012
  rule_name: Cluster DRS rule enabled state
  category: cluster
  object_type: ClusterComputeResource
  risk_level: P4
  confidence_level: high
  enabled: true
  rule_version: 1.0.0
  applicable_versions: *vsphere_versions
  implementation_status: implemented
  execution_mode: default_enabled
  capability_required: *pyvmomi_required
  report_visibility: *executed_visibility
  scoring_eligible: true
  data_source:
    type: pyvmomi
    source_domain: config
    api_paths:
    - drs_disabled_rule_count
    - drs_disabled_rules
    object_path: inventory.cluster
    sampling:
      required: false
  parameters: {}
  condition:
    type: safe_expression
    fail_when: drs_disabled_rule_count > 0
    pass_when: drs_disabled_rule_count == 0
  severity_policy: *fixed_p4
  evidence_schema:
    current_value_path: drs_disabled_rule_count
    expected_value: 0
    required_fields: *required_fields
  report_fields:
    title_zh: 集群 DRS 规则启用状态
    check_name_zh: 集群 DRS 规则启用状态
    finding_title_zh: 集群存在已停用 DRS 规则
    plain_summary_zh: 检查集群 DRS 规则启用状态，用于识别被停用的亲和或反亲和约束。
    failed_summary_zh: 集群内存在已停用的 DRS 规则，需要确认是否为预期配置。
    false_positive_notes_zh: 维护期间临时停用 DRS 规则属于常见操作，需关注长期停用且无说明的情况。
    exception_guidance_zh: 记录停用原因、业务负责人和计划恢复时间。
    when_to_ignore_zh: 规则已由业务方确认不再需要，且有配置变更记录时可忽略。
    summary_zh: DRS 规则停用可能改变虚拟机放置策略，影响业务隔离或高可用设计。
    business_impact_zh: 关键虚拟机可能不再按预期分散或绑定运行，影响可用性和合规要求。
    technical_impact_zh: DRS 调度约束失效后，虚拟机布局可能偏离设计基线。
    consequence_zh: 可能造成同类关键虚拟机集中到同一主机，或业务亲和策略未生效。
    remediation_zh: 复核已停用 DRS 规则的业务意义，保留需要的规则并删除无效历史规则。
  remediation:
    owner_role: virtualization_admin
    remediation_effort: low
    maintenance_window_required: false
    rollback_required: false
    verification_method: rerun_rule
    steps_zh:
    - 查看集群 DRS 规则清单。
    - 确认停用规则对应业务系统和变更记录。
    - 启用仍需使用的规则，清理无效历史规则。
  references: *vmware_docs
  report:
    section: cluster
    tags:
    - cluster
    - drs
  scoring:
    dimension: operations
    weight: 0.5
- schema_version: 1.0
  rule_id: VSL-HOST-014
  rule_name: ESXi host syslog configuration
  category: host
  object_type: HostSystem
  risk_level: P3
  health_impact: none
  confidence_level: high
  enabled: true
  rule_version: 1.0.0
  applicable_versions: *vsphere_versions
  implementation_status: implemented
  execution_mode: default_enabled
  capability_required: *pyvmomi_required
  report_visibility: *executed_visibility
  scoring_eligible: true
  data_source:
    type: pyvmomi
    source_domain: config
    api_paths:
    - syslog_configured
    - syslog_targets
    object_path: inventory.host
    sampling:
      required: false
  parameters: {}
  condition:
    type: safe_expression
    fail_when: syslog_configured == False
    pass_when: syslog_configured == True
  severity_policy:
    type: fixed
    default_level: P3
    rules: []
  evidence_schema:
    current_value_path: syslog_configured
    expected_value: true
    required_fields: *required_fields
  report_fields:
    title_zh: ESXi 主机 Syslog 配置
    check_name_zh: ESXi 主机 Syslog 配置
    finding_title_zh: ESXi 主机未配置远程 Syslog
    plain_summary_zh: 检查 ESXi 主机远程 Syslog 配置，用于确认日志可集中留存和审计。
    failed_summary_zh: ESXi 主机未配置远程 Syslog，故障分析和安全审计证据可能不足。
    false_positive_notes_zh: 小型测试环境可能仅保留本地日志；生产环境建议集中采集。
    exception_guidance_zh: 记录不启用远程日志的原因和替代日志留存方案。
    when_to_ignore_zh: 已有其他等效日志采集机制覆盖 ESXi 主机日志时可忽略。
    summary_zh: 远程 Syslog 可提升日志留存可靠性，避免主机故障后本地日志丢失。
    business_impact_zh: 故障追溯、安全审计和合规取证可能受到影响。
    technical_impact_zh: ESXi 主机日志仅保存在本地时，主机重装或故障可能导致证据缺失。
    consequence_zh: 可能延长故障定位时间，并影响安全事件审计完整性。
    remediation_zh: 为 ESXi 主机配置企业统一 Syslog 服务器，并验证日志接收状态。
  remediation:
    owner_role: virtualization_admin
    remediation_effort: low
    maintenance_window_required: false
    rollback_required: false
    verification_method: rerun_rule
    steps_zh:
    - 确认企业 Syslog 服务器地址。
    - 配置 ESXi Syslog.global.logHost。
    - 验证 Syslog 平台能收到主机日志。
  references: *vmware_docs
  report:
    section: host
    tags:
    - host
    - logging
  scoring:
    dimension: security
    weight: 0.8
- schema_version: 1.0
  rule_id: VSL-HOST-015
  rule_name: ESXi host firewall default policy
  category: host
  object_type: HostSystem
  risk_level: P4
  confidence_level: high
  enabled: true
  rule_version: 1.0.0
  applicable_versions: *vsphere_versions
  implementation_status: implemented
  execution_mode: default_enabled
  capability_required: *pyvmomi_required
  report_visibility: *executed_visibility
  scoring_eligible: true
  data_source:
    type: pyvmomi
    source_domain: config
    api_paths:
    - firewall_default_incoming_blocked
    object_path: inventory.host
    sampling:
      required: false
  parameters: {}
  condition:
    type: safe_expression
    fail_when: firewall_default_incoming_blocked == False
    pass_when: firewall_default_incoming_blocked == True
  severity_policy: *fixed_p4
  evidence_schema:
    current_value_path: firewall_default_incoming_blocked
    expected_value: true
    required_fields: *required_fields
  report_fields:
    title_zh: ESXi 主机防火墙默认策略
    check_name_zh: ESXi 主机防火墙默认策略
    finding_title_zh: ESXi 主机防火墙默认入站策略未阻断
    plain_summary_zh: 检查 ESXi 主机防火墙默认入站策略，用于确认主机管理面暴露面控制。
    failed_summary_zh: ESXi 主机防火墙默认入站策略未阻断，建议复核安全基线。
    false_positive_notes_zh: 某些受控隔离网络中可能采用外围防火墙控制，但主机侧仍建议保持最小暴露。
    exception_guidance_zh: 记录网络隔离策略、访问控制边界和安全负责人审批。
    when_to_ignore_zh: 已有明确的上游访问控制且主机安全基线允许时可阶段性忽略。
    summary_zh: 防火墙默认策略用于限制未显式允许的入站访问。
    business_impact_zh: 管理面暴露面扩大时，安全审计和攻击面风险增加。
    technical_impact_zh: 默认入站未阻断会降低服务级规则的约束效果。
    consequence_zh: 可能增加非预期服务被访问的风险。
    remediation_zh: 调整 ESXi 防火墙默认入站策略为阻断，并仅开放必要服务规则。
  remediation:
    owner_role: security_admin
    remediation_effort: low
    maintenance_window_required: false
    rollback_required: true
    verification_method: rerun_rule
    steps_zh:
    - 核对当前 ESXi 防火墙默认策略。
    - 确认业务需要开放的服务规则。
    - 将默认入站策略调整为阻断并复核连通性。
  references: *vmware_docs
  report:
    section: host
    tags:
    - host
    - security
  scoring:
    dimension: security
    weight: 0.5
- schema_version: 1.0
  rule_id: VSL-DS-007
  rule_name: Datastore multipath state
  category: datastore
  object_type: Datastore
  risk_level: P2
  health_impact: attention
  confidence_level: high
  enabled: true
  rule_version: 1.0.0
  applicable_versions: *vsphere_versions
  implementation_status: implemented
  execution_mode: default_enabled
  capability_required: *pyvmomi_required
  report_visibility: *executed_visibility
  scoring_eligible: true
  data_source:
    type: pyvmomi
    source_domain: runtime
    api_paths:
    - datastore_multipath_issue_count
    - datastore_path_issue_detail
    object_path: inventory.datastore
    sampling:
      required: false
  parameters: {}
  condition:
    type: safe_expression
    not_applicable_when: datastore_multipath_applicable == False
    fail_when: datastore_multipath_issue_count > 0
    pass_when: datastore_multipath_issue_count == 0
  severity_policy:
    type: fixed
    default_level: P2
    rules: []
  evidence_schema:
    current_value_path: datastore_multipath_issue_count
    expected_value: 0
    required_fields: *required_fields
  report_fields:
    title_zh: 数据存储多路径状态
    check_name_zh: 数据存储多路径状态
    finding_title_zh: 数据存储多路径状态异常
    plain_summary_zh: 检查 VMFS 数据存储相关存储路径状态，用于确认存储访问冗余。
    failed_summary_zh: 数据存储存在异常存储路径，可能降低存储访问冗余。
    false_positive_notes_zh: 单主机本地存储或部分 NAS 数据存储不适用多路径判断。
    exception_guidance_zh: 记录数据存储类型、承载业务和存储冗余设计。
    when_to_ignore_zh: 非共享 VMFS 或不依赖多路径的存储类型可忽略。
    summary_zh: 多路径异常会影响存储访问冗余和故障切换能力。
    business_impact_zh: 存储链路故障时，虚拟机 I/O 可用性可能受到影响。
    technical_impact_zh: 部分路径处于 dead、error 或 off 状态时，可用路径减少。
    consequence_zh: 可能导致 I/O 延迟升高、路径切换失败或数据存储不可访问。
    remediation_zh: 检查 HBA、SAN 交换机、存储目标端口和多路径策略，恢复异常路径后复查。
  remediation:
    owner_role: storage_admin
    remediation_effort: medium
    maintenance_window_required: false
    rollback_required: false
    verification_method: rerun_rule
    steps_zh:
    - 查看异常路径对应主机、适配器、LUN 和目标端口。
    - 检查 SAN 交换机和存储阵列端口状态。
    - 恢复路径后重新扫描存储并复跑巡检。
  references: *vmware_docs
  report:
    section: datastore
    tags:
    - datastore
    - storage
  scoring:
    dimension: availability
    weight: 1.0
- schema_version: 1.0
  rule_id: VSL-DS-008
  rule_name: Datastore active path count
  category: datastore
  object_type: Datastore
  risk_level: P3
  health_impact: none
  confidence_level: high
  enabled: true
  rule_version: 1.0.0
  applicable_versions: *vsphere_versions
  implementation_status: implemented
  execution_mode: default_enabled
  capability_required: *pyvmomi_required
  report_visibility: *executed_visibility
  scoring_eligible: true
  data_source:
    type: pyvmomi
    source_domain: runtime
    api_paths:
    - datastore_active_path_count
    object_path: inventory.datastore
    sampling:
      required: false
  parameters:
    min_datastore_active_paths:
      type: number
      default: 2
      override_allowed: true
  condition:
    type: safe_expression
    not_applicable_when: datastore_multipath_applicable == False
    fail_when: datastore_active_path_count < min_datastore_active_paths
    pass_when: datastore_active_path_count >= min_datastore_active_paths
  severity_policy:
    type: fixed
    default_level: P3
    rules: []
  evidence_schema:
    current_value_path: datastore_active_path_count
    expected_value: '>= 2'
    required_fields: *required_fields
  report_fields:
    title_zh: 数据存储活动路径数量
    check_name_zh: 数据存储活动路径数量
    finding_title_zh: 数据存储活动路径数量低于建议值
    plain_summary_zh: 检查 VMFS 数据存储活动路径数量，用于确认存储链路冗余。
    failed_summary_zh: 数据存储活动路径数量低于建议值，存储链路冗余不足。
    false_positive_notes_zh: 单路径实验环境或非关键业务数据存储可能接受较低冗余。
    exception_guidance_zh: 记录单路径设计原因、业务影响和后续冗余改造计划。
    when_to_ignore_zh: 明确为单主机、本地盘或非关键测试用途时可忽略。
    summary_zh: 活动路径数量不足会降低存储链路故障切换能力。
    business_impact_zh: 存储链路维护或故障时，业务可用性风险增加。
    technical_impact_zh: 可用活动路径不足时，多路径策略缺少足够冗余路径。
    consequence_zh: 可能导致路径故障时数据存储访问中断或性能下降。
    remediation_zh: 补齐主机到存储的链路、分区和多路径配置，确保至少具备建议数量的活动路径。
  remediation:
    owner_role: storage_admin
    remediation_effort: medium
    maintenance_window_required: false
    rollback_required: false
    verification_method: rerun_rule
    steps_zh:
    - 核对数据存储对应 LUN 的活动路径数量。
    - 检查 HBA、交换机分区和阵列映射。
    - 恢复或新增路径后重新扫描存储。
  references: *vmware_docs
  report:
    section: datastore
