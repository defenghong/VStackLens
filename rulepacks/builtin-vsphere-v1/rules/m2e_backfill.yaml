- schema_version: 1.0
  rule_id: VSL-DS-013
  rule_name: Datastore thin provisioning overcommit
  category: datastore
  object_type: Datastore
  risk_level: P3
  health_impact: none
  confidence_level: high
  enabled: true
  rule_version: 1.0.0
  applicable_versions: *vsphere_versions
  implementation_status: implemented
  execution_mode: default_enabled
  capability_required: *pyvmomi_required
  report_visibility: *executed_visibility
  scoring_eligible: true
  data_source:
    type: pyvmomi
    source_domain: config
    api_paths:
    - thin_provisioning_overcommit_ratio
    object_path: inventory.datastore
    sampling:
      required: false
  parameters:
    max_thin_overcommit_ratio:
      type: number
      default: 150
      override_allowed: true
  condition:
    type: safe_expression
    fail_when: thin_provisioning_overcommit_ratio > max_thin_overcommit_ratio
    pass_when: thin_provisioning_overcommit_ratio <= max_thin_overcommit_ratio
  severity_policy:
    type: fixed
    default_level: P3
    rules: []
  evidence_schema:
    current_value_path: thin_provisioning_overcommit_ratio
    expected_value: <= 150
    required_fields: *required_fields
  report_fields:
    title_zh: 数据存储 Thin Provisioning 超分配置
    check_name_zh: 数据存储 Thin Provisioning 超分配置
    finding_title_zh: 数据存储 Thin Provisioning 超分比过高
    plain_summary_zh: 检查数据存储已用空间与未提交空间比例，用于评估 Thin Provisioning 超分风险。
    failed_summary_zh: 数据存储 Thin Provisioning 超分比例超过建议阈值。
    false_positive_notes_zh: 已有严格容量监控和自动扩容机制时，可接受一定程度超分。
    exception_guidance_zh: 记录容量监控策略、扩容响应时限和存储负责人。
    when_to_ignore_zh: 存储平台具备自动扩容且容量告警闭环成熟时可阶段性忽略。
    summary_zh: Thin Provisioning 超分过高可能导致突发写入时空间耗尽。
    business_impact_zh: 容量耗尽会影响虚拟机写入、快照和备份任务。
    technical_impact_zh: 未提交空间较大时，实际写入增长可能快速消耗数据存储可用空间。
    consequence_zh: 可能造成虚拟机暂停、写入失败或业务中断。
    remediation_zh: 清理无效空间、迁移虚拟机或扩容数据存储，并配置容量告警。
  remediation:
    owner_role: storage_admin
    remediation_effort: medium
    maintenance_window_required: false
    rollback_required: false
    verification_method: rerun_rule
    steps_zh:
    - 核对数据存储已用空间和未提交空间。
    - 清理过期快照和无效磁盘。
    - 必要时迁移虚拟机或扩容数据存储。
  references: *vmware_docs
  report:
    section: datastore
    tags:
    - datastore
    - capacity
  scoring:
    dimension: capacity
    weight: 0.8
- schema_version: 1.0
