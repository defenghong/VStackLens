    finding_title_zh: 虚拟机快照链过深
    plain_summary_zh: 检查虚拟机快照树深度，用于识别长期叠加快照链风险。
    failed_summary_zh: 虚拟机快照链深度超过建议阈值，建议尽快合并。
    false_positive_notes_zh: 变更窗口内短期形成的多级快照可接受，但不应长期保留。
    exception_guidance_zh: 记录快照用途、负责人和计划删除时间。
    when_to_ignore_zh: 正在进行受控变更且快照将在窗口内清理时可临时忽略。
    summary_zh: 过深快照链会增加读写开销和合并失败风险。
    business_impact_zh: 业务性能和备份稳定性可能受到影响。
    technical_impact_zh: 多级 redo 日志会增加 I/O 路径复杂度和存储空间增长。
    consequence_zh: 可能导致虚拟机性能下降、快照删除耗时过长或合并失败。
    remediation_zh: 核对快照用途，在确认业务正常后删除或合并无用快照。
