    check_name_zh: 数据存储文件系统版本
    finding_title_zh: 数据存储文件系统版本较旧
    plain_summary_zh: 检查 VMFS 数据存储文件系统版本，用于识别较旧文件系统基线。
    failed_summary_zh: 数据存储文件系统版本较旧，建议评估升级或迁移。
    false_positive_notes_zh: 存量环境可能因兼容性保留旧 VMFS 版本，应结合业务迁移窗口评估。
    exception_guidance_zh: 记录保留旧版本原因、兼容性约束和迁移计划。
    when_to_ignore_zh: 数据存储仅承载遗留业务且短期不升级平台时可阶段性忽略。
    summary_zh: 旧版 VMFS 可能缺少新版本能力，并增加生命周期管理复杂度。
    business_impact_zh: 后续平台升级、存储迁移和功能使用可能受到限制。
    technical_impact_zh: 旧版文件系统与新版本 vSphere 功能的兼容性和性能特性可能有限。
    consequence_zh: 可能增加迁移改造成本，并影响后续升级路径。
    remediation_zh: 规划数据存储迁移或新建 VMFS6 数据存储，逐步迁移虚拟机。
  remediation:
    owner_role: storage_admin
    remediation_effort: high
    maintenance_window_required: true
    rollback_required: true
    verification_method: manual_check
    steps_zh:
    - 确认数据存储文件系统版本和承载业务。
    - 新建符合当前基线的数据存储。
    - 通过 Storage vMotion 或维护窗口迁移虚拟机。
  references: *vmware_docs
  report:
    section: datastore
    tags:
