    plain_summary_zh: 检查 vCenter 近期任务中运行中和排队任务数量，用于识别任务积压。
    failed_summary_zh: vCenter 存在较多运行中或排队任务，建议关注任务处理状态。
    false_positive_notes_zh: 大批量迁移、批量开关机或维护窗口内任务增多属于正常现象。
    exception_guidance_zh: 记录维护窗口、批量操作计划和预计完成时间。
    when_to_ignore_zh: 正在进行明确的批量维护且任务持续推进时可忽略。
    summary_zh: 任务积压可能反映 vCenter 处理压力或后台任务异常。
    business_impact_zh: 管理操作响应时间可能变长，维护任务可能延迟完成。
    technical_impact_zh: 大量排队或运行中任务会影响 vCenter 调度和运维可见性。
    consequence_zh: 可能导致任务失败、维护窗口延长或操作反馈滞后。
    remediation_zh: 查看积压任务详情，确认是否为正常批量操作；异常任务需定位对应对象和服务状态。
  remediation:
    owner_role: virtualization_admin
    remediation_effort: low
    maintenance_window_required: false
    rollback_required: false
    verification_method: manual_check
    steps_zh:
    - 查看 vCenter Recent Tasks 中运行中和排队任务。
    - 确认是否属于计划内批量操作。
    - 对长期无进展任务定位对象和相关服务状态。
