    business_impact_zh: 如果误用于业务数据盘，可能导致数据丢失。
    technical_impact_zh: independent_nonpersistent 模式不会按普通磁盘方式保留写入变化。
    consequence_zh: 可能造成应用数据不一致或恢复后数据缺失。
